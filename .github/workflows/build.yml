name: build-and-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        # The XPU build pulls oneAPI 2025.3 and produces a ~28GB image. The
        # default GH runner only has ~14GB free; this action reclaims ~30GB
        # by stripping preinstalled tooling we don't need.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Read pinned vLLM commit
        id: pin
        run: |
          source .env.example
          echo "commit=$VLLM_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Clone pinned vLLM source
        run: ./setup.sh
        env:
          VLLM_COMMIT: ${{ steps.pin.outputs.commit }}
          VLLM_SRC: ./vllm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=vllm-${{ steps.pin.outputs.commit }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./vllm
          file: ./vllm/docker/Dockerfile.xpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
